name: Specification format tests (not crypto validation)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  header-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test reference codec using runner Python
        run: python3 -m unittest discover -s tests -v
  rust-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test dependency-free Rust workspace
        run: python3 tools/ci_verify_rust.py
  android-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Compile and test LAB only (no release signing)
        working-directory: apps/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Report tests and package LAB warning with APK
        run: python3 tools/ci_android_report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MeshChat-LAB-not-a-messenger
          path: artifacts/lab/
          if-no-files-found: error
          retention-days: 7
