name: Build & Publish MeshChat APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 & JDK 17
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run automated security & transport test suites
        run: npm test

      - name: Build signed MeshChat.apk with permanent release keystore
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          python3 -m pip install --quiet pillow
          npm run build:apk
          sha256sum MeshChat.apk | awk '{print $1}' > MeshChat.apk.sha256

      - name: Upload APK to GitHub Release (only if not already published)
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_B64 != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SHA=$(cat MeshChat.apk.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING=$(gh release view "$TAG" --json assets -q '.assets[].name' || true)
            if echo "$EXISTING" | grep -qx "MeshChat.apk"; then
              echo "MeshChat.apk уже прикреплён к релизу $TAG — перезапись пропущена для сохранения SHA-256."
            else
              gh release upload "$TAG" MeshChat.apk
            fi
          else
            gh release create "$TAG" MeshChat.apk \
              --title "MeshChat $TAG" \
              --notes "Автоматическая сборка MeshChat ($TAG).\n\nSHA-256: \`$SHA\`"
          fi
