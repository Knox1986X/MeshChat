name: MeshChat CI & Auto-Update Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Run Crypto, Transport & Blind Server Tests
        run: npm test

      - name: Build Signed MeshChat.apk
        run: npm run build:apk

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(sha256sum MeshChat.apk | awk '{print $1}')
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" MeshChat.apk \
            --title "MeshChat $TAG" \
            --notes "Автоматическая сборка MeshChat $TAG (Signal E2E + Мультитранспорт).

          SHA256: \`$SHA\`" || \
          gh release upload "$TAG" MeshChat.apk --clobber
