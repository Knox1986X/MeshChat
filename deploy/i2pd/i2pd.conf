# Конфигурация демона i2pd для публикации скрытого узла Veil Messenger (.b32.i2p)
ipv4 = true
ipv6 = false
ssu2 = true
ntcp2 = true
loglevel = warn

# Внутренние прокси отключены (контейнер работает только как серверный туннель к veil:3000)
[http]
enabled = false

[httpproxy]
enabled = false

[socksproxy]
enabled = false

[sam]
enabled = false
