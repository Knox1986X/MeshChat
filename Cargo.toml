[workspace]
members = ["crates/eco-envelope", "crates/session-policy", "crates/transport-policy", "crates/store"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
panic = "abort"
strip = true
