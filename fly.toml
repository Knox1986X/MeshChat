# Fly.io deployment for the MeshChat relay.
#   fly launch --no-deploy
#   fly volumes create meshchat_data --size 1
#   fly deploy
app = "meshchat-relay"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  MESHCHAT_PORT = "8787"
  MESHCHAT_HOST = "0.0.0.0"
  MESHCHAT_DATA = "/data"
  MESHCHAT_POW = "16"
  MESHCHAT_TTL_DAYS = "7"

[mounts]
  source = "meshchat_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/v1/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
